[project]
name = "fishbook"
version = "0.1.0"
description = "闲鱼 / 小红书数据抓取工具：把浏览器当作带登录态的 JS 运行时"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["websockets>=12.0", "fastapi>=0.110", "uvicorn>=0.29", "openai>=1.30"]

[project.scripts]
fishbook = "fishbook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fishbook"]

[dependency-groups]
dev = ["ruff>=0.6", "watchfiles>=0.21"]

[tool.ruff]
line-length = 100
target-version = "py312"
